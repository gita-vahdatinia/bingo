# Render blueprint. Point Render at this repo once and it builds the Dockerfile,
# provisions the database, wires DATABASE_URL in, and redeploys on every push.
#
# NOTE: the service `name` below decides the public hostname
# (pregussy-bingo.onrender.com) and Render fixes that subdomain when the service
# is first created. Renaming a service later changes only its display name, so
# changing the name here creates a *new* service rather than moving the old one.

databases:
  - name: pregussy-db
    plan: free
    databaseName: pregussy
    user: pregussy
    region: oregon

services:
  - type: web
    name: pregussy-bingo
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Without this the app falls back to a local JSON file, which on a free
      # instance is wiped by every deploy and every idle spin-down.
      - key: DATABASE_URL
        fromDatabase:
          name: pregussy-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO

# Render deletes a free database 30 days after it is created (plus a 14-day grace
# period). When that happens the app keeps serving and just stops persisting — see
# the "running in memory only" warning in the logs. Create a fresh free database and
# update DATABASE_URL to get durability back.
