<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lineup Bingo">
  <rect width="64" height="64" rx="16" fill="#1F5C4A"/>
  <!-- Sun low over the park. -->
  <circle cx="32" cy="30" r="17" fill="#D4A72C" opacity=".16"/>
  <g fill="#F5F4EF">
    <rect x="12" y="12" width="12" height="12" rx="4" opacity=".5"/>
    <rect x="26" y="12" width="12" height="12" rx="4" opacity=".5"/>
    <rect x="40" y="12" width="12" height="12" rx="4" opacity=".5"/>
    <rect x="12" y="26" width="12" height="12" rx="4" opacity=".5"/>
    <rect x="40" y="26" width="12" height="12" rx="4" opacity=".5"/>
    <rect x="12" y="40" width="12" height="12" rx="4" opacity=".5"/>
    <rect x="26" y="40" width="12" height="12" rx="4" opacity=".5"/>
  </g>
  <!-- The winning diagonal, in gold. -->
  <rect x="26" y="26" width="12" height="12" rx="4" fill="#D4A72C"/>
  <rect x="40" y="40" width="12" height="12" rx="4" fill="#D4A72C"/>
</svg>
